name: Docs validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.19"

      - name: Build documentation strictly
        run: uv run --frozen --extra docs mkdocs build --strict

      # Publishing is intentionally release-only. release.yml deploys the
      # exact prebuilt site from the tagged github.sha.
